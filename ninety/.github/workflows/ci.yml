name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ninety

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ninety
          POSTGRES_PASSWORD: ninety
          POSTGRES_DB: ninety
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ninety -d ninety"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgresql://ninety:ninety@localhost:5432/ninety
      TEST_DATABASE_URL: postgresql://ninety:ninety@localhost:5432/ninety_test
      REDIS_URL: redis://localhost:6379
      REDIS_NAMESPACE: ninety-ci
      JWT_SECRET: ci-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-else
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ninety/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # PostGIS must actually be available. Discovering its absence in the
      # matching engine instead of here is expensive.
      - name: Verify PostGIS
        run: |
          PGPASSWORD=ninety psql -h localhost -U ninety -d ninety \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; SELECT postgis_version();"
          PGPASSWORD=ninety createdb -h localhost -U ninety ninety_test
          PGPASSWORD=ninety psql -h localhost -U ninety -d ninety_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The guard that outlives every other decision: no market-specific literal
      # in application code, and no message key present in English and missing in
      # Arabic. Both fail the build.
      - name: Market-value and locale guards
        run: pnpm --filter @ninety/config test

      - name: Tests
        run: pnpm test

      - name: Prove the guards actually bite
        run: |
          ./scripts/guard-demo.sh
          ./scripts/locale-demo.sh

      # The Play data-safety declaration has to match the manifest. Checked here
      # rather than discovered by a store review three days before launch.
      - name: Play data-safety declaration
        run: node scripts/check-data-safety.mjs

      # The unhappy-path document is generated from the shipping catalogues. If
      # regenerating it changes anything, somebody edited the document instead of
      # the copy, and the launch team would be quoting a message nobody receives.
      - name: The unhappy-path document matches the product
        run: |
          node scripts/generate-unhappy-paths.mjs
          git diff --exit-code docs/UNHAPPY-PATHS.md
